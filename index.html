<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新华字典 · 部首檢字表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #EFE4CC;
    --page-shadow: #DCCEA8;
    --ink: #241F18;
    --ink-soft: #55483A;
    --seal: #A5312A;
    --seal-dark: #7C2420;
    --gold: #A9843F;
    --cover: #6E1E1E;
    --cover-dark: #501414;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at center, #2b2420 0%, #16120f 100%);
    font-family: "Noto Serif", serif;
    color: var(--ink);
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px 16px;
  }
  .book{
    position:relative;
    width:min(1180px, 97vw);
    background: linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.04) inset;
    padding: 16px;
  }
  .book::before{
    content:"";
    position:absolute; inset:10px;
    border: 1px solid rgba(201,168,90,0.35);
    border-radius: 4px;
    pointer-events:none;
  }

  /* --- search ribbon, tucked into the top of the book like a bookmark --- */
  .search-ribbon{
    display:flex; align-items:center; gap: 10px;
    padding: 4px 10px 12px;
  }
  .search-box{
    flex: 0 1 340px;
    display:flex; align-items:center; gap: 8px;
    background: #fff8e8;
    border: 1px solid rgba(201,168,90,0.5);
    border-radius: 20px;
    padding: 7px 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }
  .search-box svg{ flex: 0 0 auto; opacity:0.55; }
  .search-box input{
    border:none; outline:none; background:none;
    font-family:"Noto Serif SC", serif;
    font-size: 14px; color: var(--ink);
    width: 100%;
  }
  .search-box input::placeholder{ color: var(--ink-soft); opacity:0.65; font-family:"Noto Serif", serif; font-style: italic; }
  .search-clear{
    background:none; border:none; cursor:pointer; color: var(--ink-soft);
    font-size: 14px; opacity:0.6; padding: 0 2px; display:none;
  }
  .search-clear.show{ display:inline; }
  .search-hint{
    font-size: 11px; color: rgba(239,228,204,0.55); letter-spacing: 0.5px;
  }

  .spread{
    position:relative;
    display:flex;
    background: var(--page);
    border-radius: 2px;
    height: calc(100vh - 148px);
    max-height: 820px;
    min-height: 460px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  /* center crease */
  .spread::after{
    content:"";
    position:absolute; left:50%; top:0; bottom:0; width:1px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.14) 15%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.14) 85%, transparent);
    box-shadow: -6px 0 14px -6px rgba(0,0,0,0.18) inset, 6px 0 14px -6px rgba(0,0,0,0.18) inset;
    pointer-events:none; z-index:1;
  }
  .page{
    flex: 1 1 50%;
    width: 50%;
    padding: 20px 26px 30px;
    position:relative;
    display:flex; flex-direction:column;
    height:100%; box-sizing:border-box;
    transition: opacity .15s ease;
  }
  .page-left{ padding-right: 20px; }
  .page-right{ padding-left: 20px; }
  .page-content{ flex: 1 1 0; min-height: 0; display:flex; flex-direction:column; }

  .page-running-head{
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--ink-soft); opacity: 0.65; margin-bottom: 2px;
    flex: 0 0 auto;
  }
  .page-title{
    font-family:"Noto Serif SC", serif;
    font-weight:700;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--seal-dark);
    margin: 0 0 4px 0;
    flex: 0 0 auto;
  }
  .page-sub{
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
    flex: 0 0 auto;
  }

  /* ---------------- 部首目錄 (radical index) pages ---------------- */
  .radical-list{
    columns: 3;
    column-gap: 16px;
    column-fill: balance;
    flex: 0 1 auto;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .stroke-group-label{
    font-size: 10px; color: var(--seal-dark);
    letter-spacing: 2px; margin: 6px 0 3px 0;
    font-weight: 700;
    border-bottom: 1px solid rgba(165,49,42,0.3);
    padding-bottom: 2px;
    break-after: avoid;
    break-inside: avoid;
  }
  .radical-row{
    display:flex; align-items:center; gap: 7px;
    padding: 2px 4px; border-radius: 2px;
    cursor:pointer; transition: background .15s ease;
    line-height: 1.35;
    break-inside: avoid;
  }
  .radical-row:hover{ background: rgba(165,49,42,0.08); }
  .radical-row.active{ background: rgba(165,49,42,0.16); }
  .radical-glyph{
    font-family:"Noto Serif SC", serif;
    font-size: 16px;
    color: var(--ink);
    white-space: nowrap;
    flex: 0 0 auto;
    display:flex; align-items:baseline; gap: 3px;
  }
  .radical-glyph .variant{ font-size: 12px; color: var(--gold); }
  .radical-pinyin{
    font-family:"Noto Serif", serif;
    font-size: 10px;
    color: var(--seal-dark);
    opacity: 0.78;
    font-style: italic;
    letter-spacing: 0.3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .radical-no{ font-size: 10px; color: var(--ink-soft); flex: 0 0 22px; text-align: right; }
  .radical-row.dim{ opacity: 0.4; cursor: default; }

  /* ---------------- 檢字表 (character index) pages ---------------- */
  .entries-head{
    display:flex; align-items:baseline; gap: 12px; margin-bottom: 4px;
    padding-bottom: 8px; border-bottom: 1.5px solid rgba(165,49,42,0.35);
    flex: 0 0 auto;
  }
  .entries-head .big-glyph{
    font-family:"Noto Serif SC", serif; font-size: 34px; color: var(--seal);
    line-height:1; white-space: nowrap;
    display:flex; align-items:baseline; gap:5px;
  }
  .entries-head .big-glyph .variant-big{ font-size: 20px; color: var(--gold); }
  .entries-head .meta{ font-size:11px; color: var(--ink-soft); line-height:1.5; }
  .entries-empty{
    margin-top: 40px; text-align:center; color: var(--ink-soft);
    font-style: italic; font-size: 13px;
  }
  .entries-body{ flex: 0 1 auto; width: 100%; overflow: hidden; padding-right: 2px; min-height:0; }

  .stroke-block-label{
    font-size: 10px; color: var(--seal-dark); letter-spacing:2px;
    margin: 9px 0 4px; font-weight: 700;
    break-after: avoid;
  }
  .search-group-label{
    font-size: 10px; color: var(--seal-dark); letter-spacing: 2px;
    font-weight: 700; margin: 10px 0 4px; break-after: avoid;
  }
  .search-result-heading{
    font-size: 11px; color: var(--ink-soft); margin-bottom: 6px;
  }
  .dict-entry{
    break-inside: avoid;
    padding: 2px 4px 3px 0;
    cursor: pointer;
    border-radius: 2px;
    line-height: 1.38;
  }
  .dict-entry:hover{ background: rgba(165,49,42,0.06); }
  .dict-entry.flash{ background: rgba(165,49,42,0.22); }
  .dict-entry .headword{
    font-family:"Noto Serif SC", serif; font-weight: 700;
    font-size: 15px; color: var(--ink);
  }
  .dict-entry .head-pinyin{
    font-size: 12px; color: var(--seal-dark); margin-left: 6px; font-style: italic;
  }
  .dict-entry .head-strokes{
    font-size: 10px; color: var(--gold); margin-left: 5px;
  }
  .dict-entry .head-def{
    display:block; font-size: 11px; color: var(--ink-soft); margin-top: 1px;
  }

  /* page number, bottom corner of every page — like a real printed book */
  .page-number{
    position:absolute; bottom: 8px; font-size: 10px; color: var(--ink-soft);
    opacity: 0.55; letter-spacing: 1px;
  }
  .page-left .page-number{ left: 26px; }
  .page-right .page-number{ right: 26px; }

  /* page-turn flip effect */
  .spread.flipping .page-left{ animation: leafOut .34s ease; }
  .spread.flipping .page-right{ animation: leafIn .34s ease; }
  @keyframes leafOut{
    0%{ opacity:1; transform: none; }
    45%{ opacity:0.15; transform: perspective(1400px) rotateY(-6deg) scale(0.99); }
    100%{ opacity:1; transform: none; }
  }
  @keyframes leafIn{
    0%{ opacity:1; transform: none; }
    45%{ opacity:0.15; transform: perspective(1400px) rotateY(6deg) scale(0.99); }
    100%{ opacity:1; transform: none; }
  }

  .page-nav{
    display:flex; align-items:center; justify-content:center; gap: 22px;
    min-height: 38px;
    padding: 6px 0 4px;
  }
  .nav-btn{
    background:none; border:none; color: rgba(239,228,204,0.7);
    font-size: 26px; cursor:pointer; padding: 0 4px; line-height:1;
    transition: color .15s;
  }
  .nav-btn:hover:not(:disabled){ color: #fff8e8; }
  .nav-btn:disabled{ opacity: 0.18; cursor:default; }
  .page-counter{
    font-size: 11px; color: rgba(239,228,204,0.55); letter-spacing: 1px;
    min-width: 130px; text-align:center;
    font-family:"Noto Serif SC", serif;
  }

  @media (max-height: 700px) and (min-width: 821px){
    .stage{ align-items:flex-start; padding-top: 8px; padding-bottom: 8px; }
    .spread{ height: calc(100vh - 112px); min-height: 0; }
  }

  @media (max-width: 820px){
    .spread{ flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
    .page{ width: 100%; height: auto; }
    .page-left{ padding-right: 26px; border-bottom: 8px solid rgba(0,0,0,0.06); }
    .radical-list{ columns: 2; flex: none; overflow: visible; }
    .spread::after{ display:none; }
    .page-number{ position: static; margin-top: 8px; text-align: right; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="book">

    <div class="search-ribbon">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="查字 / 拼音 / meaning…" autocomplete="off">
        <button class="search-clear" id="searchClear">&times;</button>
      </div>
      <span class="search-hint" id="searchHint"></span>
    </div>

    <div class="spread" id="spread">
      <div class="page page-left">
        <div class="page-content" id="pageLeftContent"></div>
        <div class="page-number" id="pageNumLeft"></div>
      </div>
      <div class="page page-right">
        <div class="page-content" id="pageRightContent"></div>
        <div class="page-number" id="pageNumRight"></div>
      </div>
    </div>

    <div class="page-nav">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <span class="page-counter" id="pageCounter"></span>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
  </div>
</div>

<script src="radicals_full.js"></script>
<script src="sample_data.js"></script>
<script src="jianzi_data.js"></script>
<script src="data_loader.js"></script>
<script>
  const pageLeftContent  = document.getElementById('pageLeftContent');
  const pageRightContent = document.getElementById('pageRightContent');
  const spreadEl         = document.getElementById('spread');
  const searchInput      = document.getElementById('searchInput');
  const searchClear      = document.getElementById('searchClear');
  const searchHint       = document.getElementById('searchHint');
  const pageNumLeftEl    = document.getElementById('pageNumLeft');
  const pageNumRightEl   = document.getElementById('pageNumRight');
  const pageCounterEl    = document.getElementById('pageCounter');
  const prevBtn          = document.getElementById('prevBtn');
  const nextBtn          = document.getElementById('nextBtn');

  const RADICALS = KANGXI_RADICALS_FULL;
  let ENTRIES = [];
  let PAGES = [];            // the whole book, in flip order: 部首目录 pages, then 检字表 pages
  let currentPageIdx = 0;
  let pendingHighlightWord = null;

  const byStroke = {};
  RADICALS.forEach(r => { (byStroke[r.strokes] = byStroke[r.strokes] || []).push(r); });
  const strokeKeys = Object.keys(byStroke).map(Number).sort((a,b)=>a-b);

  // 部首目录 pages: instead of fixed stroke-count breakpoints (which produce
  // wildly uneven page sizes — one page crammed, the next nearly empty),
  // pack whole stroke-count groups into as few spreads as comfortably fit,
  // splitting as evenly as possible between them. TARGET_INDEX_CAPACITY is
  // a rough estimate of how many rows (radicals + stroke-count headers)
  // one full two-page spread can hold at this layout's column count/size.
  const TARGET_INDEX_CAPACITY = 165;
  function computeIndexGroups(){
    const totalItems = strokeKeys.reduce((sum, sk) => sum + byStroke[sk].length + 1, 0);
    const n = Math.max(1, Math.ceil(totalItems / TARGET_INDEX_CAPACITY));
    const targetPerGroup = totalItems / n;
    const groups = [];
    let cur = [], curSum = 0;
    strokeKeys.forEach((sk, i) => {
      cur.push(sk);
      curSum += byStroke[sk].length + 1;
      const keysLeft = strokeKeys.length - i - 1;
      if (groups.length < n - 1 && curSum >= targetPerGroup && keysLeft > 0){
        groups.push(cur); cur = []; curSum = 0;
      }
    });
    if (cur.length) groups.push(cur);
    return groups;
  }
  const INDEX_GROUPS = computeIndexGroups();
  const NUM_INDEX_PAGES = INDEX_GROUPS.length;

  const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七'];
  const strokeLabel = sk => (CN[sk-1] || sk) + '画';

  // How many entry rows (not counting stroke-count headers) fit across one
  // whole two-page 检字表 spread before it continues onto another spread —
  // same idea as a real dictionary running out of room on a populous
  // radical like 木 or 言 and continuing the listing onto the next page.
  const ENTRIES_PER_SPREAD = 34;

  // ---------- building the book ----------

  // A flat list of {type:'label', text} / {type:'radical', r} items for one
  // 部首目录 page group, in the order they'd print.
  function itemsForIndexGroup(g){
    const items = [];
    INDEX_GROUPS[g].forEach(sk => {
      items.push({ type: 'label', cls: 'stroke-group-label', text: strokeLabel(sk) });
      byStroke[sk].forEach(r => items.push({ type: 'radical', r }));
    });
    return items;
  }

  // A flat list of {type:'label'} / {type:'entry', e} items for one
  // radical's characters, grouped by residual stroke count, chunked into
  // spread-sized pages.
  function chunkRadicalEntries(list){
    const byRs = {};
    list.forEach(e => (byRs[e.rs] = byRs[e.rs] || []).push(e));
    const rsKeys = Object.keys(byRs).map(Number).sort((a,b)=>a-b);
    const items = [];
    rsKeys.forEach(rs => {
      items.push({ type: 'label', cls: 'stroke-block-label', text: `+${rs} 画` });
      byRs[rs].forEach(e => items.push({ type: 'entry', e }));
    });
    const chunks = [];
    let cur = [], count = 0;
    items.forEach(item => {
      cur.push(item);
      if (item.type === 'entry') count++;
      if (count >= ENTRIES_PER_SPREAD){ chunks.push(cur); cur = []; count = 0; }
    });
    if (cur.length) chunks.push(cur);
    return chunks.length ? chunks : [[]];
  }

  // Splits one spread's items array roughly in half between the left and
  // right page, without ever stranding a header label alone at the bottom
  // of the left page (a real book wouldn't print a heading with nothing
  // under it either).
  function splitItemsForSpread(items){
    let mid = Math.ceil(items.length / 2);
    while (mid > 0 && items[mid - 1] && items[mid - 1].type === 'label') mid--;
    return [items.slice(0, mid), items.slice(mid)];
  }

  // The whole book, front to back: every 部首目录 spread first, then every
  // 检字表 spread (radical by radical, in the standard 214-radical order).
  // A radical with zero characters on file simply doesn't get a 检字表
  // section — same as a real dictionary wouldn't print an empty entry.
  function buildPages(){
    const pages = [];
    for (let g = 0; g < NUM_INDEX_PAGES; g++) pages.push({ type: 'index', groupIdx: g });

    const byRadical = {};
    ENTRIES.forEach(e => { (byRadical[e.r] = byRadical[e.r] || []).push(e); });

    RADICALS.forEach(r => {
      const list = byRadical[r.no];
      if (!list || !list.length) return;
      const chunks = chunkRadicalEntries(list);
      chunks.forEach((items, ci) => {
        pages.push({ type: 'entries', radicalNo: r.no, items, chunkIndex: ci, totalChunks: chunks.length });
      });
    });

    PAGES = pages;
  }

  function firstPageIndexForRadical(no){
    return PAGES.findIndex(p => p.type === 'entries' && p.radicalNo === no);
  }
  function pageIndexForWord(word, radicalNo){
    return PAGES.findIndex(p => p.type === 'entries' && p.radicalNo === radicalNo &&
      p.items.some(it => it.type === 'entry' && it.e.w === word));
  }

  // ---------- rendering ----------

  function dictEntryHTML(e){
    const strokes = e.ts ? `<span class="head-strokes">共${e.ts}画</span>` : '';
    return `
      <div class="dict-entry" data-word="${e.w}">
        <span class="headword">${e.w}</span><span class="head-pinyin">${e.py}</span>${strokes}
        <span class="head-def">${e.def}</span>
      </div>`;
  }

  function radicalRowHTML(r){
    const known = !ENTRIES.length || firstPageIndexForRadical(r.no) !== -1;
    return `
      <div class="radical-row${known ? '' : ' dim'}" data-radical="${r.no}">
        <span class="radical-no">${r.no}</span>
        <span class="radical-glyph">${r.char}${r.variant ? `<span class="variant">${r.variant}</span>` : ''}</span>${r.pinyin ? `<span class="radical-pinyin">${r.pinyin}</span>` : ''}
      </div>`;
  }

  function renderIndexHalf(container, items, { first }){
    let html = '';
    if (first){
      html += `
        <div class="page-running-head">部首檢字表 · RADICAL INDEX</div>
        <div class="page-title">部首目錄</div>
        <div class="page-sub">(一) click a radical to open its 檢字表 page</div>`;
    }
    html += `<div class="radical-list">`;
    items.forEach(item => {
      html += item.type === 'label'
        ? `<div class="${item.cls}">${item.text}</div>`
        : radicalRowHTML(item.r);
    });
    html += `</div>`;
    container.innerHTML = html;
    container.querySelectorAll('.radical-row:not(.dim)').forEach(row => {
      row.addEventListener('click', () => jumpToRadical(Number(row.dataset.radical)));
    });
  }

  function renderIndexSpread(groupIdx){
    const items = itemsForIndexGroup(groupIdx);
    const [left, right] = splitItemsForSpread(items);
    renderIndexHalf(pageLeftContent, left, { first: true });
    renderIndexHalf(pageRightContent, right, { first: false });
  }

  function renderEntriesHalf(container, items, { head } = {}){
    let html = '';
    if (head){
      html += `
        <div class="page-running-head">檢字表 · CHARACTER INDEX</div>
        <div class="entries-head">
          <div class="big-glyph">${head.radical.char}${head.radical.variant ? `<span class="variant-big">${head.radical.variant}</span>` : ''}</div>
          <div class="meta">部首 ${head.radical.no} · ${head.radical.strokes} 画 · ${head.radical.pinyin}<br>${head.radical.meaning}${head.totalChunks > 1 ? `<br><span style="font-size:9px;opacity:.65;">第 ${head.chunkIndex + 1} / ${head.totalChunks} 页 · continued</span>` : ''}</div>
        </div>`;
    }
    html += `<div class="entries-body">`;
    if (!items.length){
      html += `<div class="entries-empty">（此部首暂无收字）</div>`;
    } else {
      items.forEach(item => {
        html += item.type === 'label'
          ? `<div class="${item.cls}">${item.text}</div>`
          : dictEntryHTML(item.e);
      });
    }
    html += `</div>`;
    container.innerHTML = html;
  }

  function renderEntriesSpread(page){
    const radical = RADICALS.find(r => r.no === page.radicalNo);
    const [left, right] = splitItemsForSpread(page.items);
    renderEntriesHalf(pageLeftContent, left, {
      head: { radical, totalChunks: page.totalChunks, chunkIndex: page.chunkIndex },
    });
    renderEntriesHalf(pageRightContent, right, {});
  }

  function applyPendingHighlight(){
    if (!pendingHighlightWord) return;
    const tile = document.querySelector(`.dict-entry[data-word="${pendingHighlightWord}"]`);
    if (tile){
      tile.classList.add('flash');
      tile.scrollIntoView({ block: 'center' });
      setTimeout(() => tile.classList.remove('flash'), 1400);
    }
    pendingHighlightWord = null;
  }

  function renderPageNav(){
    prevBtn.disabled = currentPageIdx === 0;
    nextBtn.disabled = currentPageIdx === PAGES.length - 1;
    const page = PAGES[currentPageIdx];
    if (!page) { pageCounterEl.textContent = ''; return; }
    if (page.type === 'index'){
      const sks = INDEX_GROUPS[page.groupIdx];
      const lo = sks[0], hi = sks[sks.length - 1];
      pageCounterEl.textContent = '部首目录 · ' + (lo === hi ? strokeLabel(lo) : strokeLabel(lo) + ' — ' + strokeLabel(hi));
    } else {
      const radical = RADICALS.find(r => r.no === page.radicalNo);
      pageCounterEl.textContent = `檢字表 · 部首 ${radical.char} (${radical.no})`;
    }
  }

  function goToPage(i, { silent } = {}){
    if (i < 0 || i >= PAGES.length) return;
    currentPageIdx = i;
    const page = PAGES[i];
    if (!silent){
      spreadEl.classList.add('flipping');
      setTimeout(() => spreadEl.classList.remove('flipping'), 340);
    }
    if (page.type === 'index') renderIndexSpread(page.groupIdx);
    else renderEntriesSpread(page);
    pageNumLeftEl.textContent = i * 2 + 1;
    pageNumRightEl.textContent = i * 2 + 2;
    renderPageNav();
    applyPendingHighlight();
  }

  function jumpToRadical(no){
    const idx = firstPageIndexForRadical(no);
    if (idx === -1){
      searchHint.textContent = '(no characters filed under this radical yet)';
      setTimeout(() => { if (!searchInput.value.trim()) searchHint.textContent = ''; }, 1800);
      return;
    }
    goToPage(idx);
  }

  prevBtn.addEventListener('click', () => goToPage(currentPageIdx - 1));
  nextBtn.addEventListener('click', () => goToPage(currentPageIdx + 1));

  function onEntryClick(e){
    const tile = e.target.closest('.dict-entry');
    if (!tile) return;
    const entry = ENTRIES.find(x => x.w === tile.dataset.word);
    if (!entry) return;
    const idx = pageIndexForWord(entry.w, entry.r);
    if (idx === -1) return;
    pendingHighlightWord = entry.w;
    searchInput.value = '';
    searchClear.classList.remove('show');
    searchHint.textContent = '';
    goToPage(idx);
  }
  pageLeftContent.addEventListener('click', onEntryClick);
  pageRightContent.addEventListener('click', onEntryClick);

  // ---------------- search ----------------
  function stripTones(s){ return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  const isHanChar = ch => /[\u4e00-\u9fff]/.test(ch);

  function runSearch(qRaw){
    const q = qRaw.trim();
    searchClear.classList.toggle('show', q.length > 0);
    if (!q){
      searchHint.textContent = '';
      goToPage(currentPageIdx, { silent: true });
      return;
    }

    const qHan = [...q].filter(isHanChar);
    const qLatin = stripTones(q);
    let results;
    if (qHan.length){
      results = ENTRIES.filter(e => qHan.includes(e.w));
    } else {
      results = ENTRIES.filter(e =>
        stripTones(e.py).includes(qLatin) || (e.def || '').toLowerCase().includes(qLatin)
      ).slice(0, 300);
    }

    searchHint.textContent = results.length ? `${results.length} found` : 'no matches';

    if (!results.length){
      pageLeftContent.innerHTML = `<div class="entries-empty">未找到「${q}」<br><span style="font-size:11px;">No matches for "${q}"</span></div>`;
      pageRightContent.innerHTML = '';
      pageNumLeftEl.textContent = '';
      pageNumRightEl.textContent = '';
      return;
    }

    const byRadical = {};
    results.forEach(e => (byRadical[e.r] = byRadical[e.r] || []).push(e));
    const radicalKeys = Object.keys(byRadical).map(Number).sort((a,b)=>a-b);

    const items = [{ type: 'label', cls: 'search-result-heading', text: `「${q}」 — ${results.length} result${results.length === 1 ? '' : 's'}` }];
    radicalKeys.forEach(rno => {
      const radical = RADICALS.find(r => r.no === rno);
      items.push({ type: 'label', cls: 'search-group-label', text: `部首 ${radical.char} (${rno})` });
      byRadical[rno].forEach(e => items.push({ type: 'entry', e }));
    });

    const [left, right] = splitItemsForSpread(items);
    renderEntriesHalf(pageLeftContent, left, {});
    renderEntriesHalf(pageRightContent, right, {});
    pageNumLeftEl.textContent = '';
    pageNumRightEl.textContent = '';
  }

  let searchDebounce;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => runSearch(searchInput.value), 120);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    runSearch('');
    searchInput.focus();
  });

  async function init(){
    buildPages();          // 部首目录 pages only, until entries load
    goToPage(0, { silent: true });
    const { entries } = await loadJianziEntries();
    ENTRIES = entries;
    buildPages();           // now the 检字表 pages exist too, appended after
    if (PAGES[currentPageIdx] && PAGES[currentPageIdx].type === 'index'){
      renderIndexSpread(PAGES[currentPageIdx].groupIdx); // refresh the "dim" state on unfiled radicals
    }
  }
  init();
</script>

</body>
</html>
