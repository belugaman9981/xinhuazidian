<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检字表 · Radical Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #EFE4CC;
    --page-shadow: #DCCEA8;
    --ink: #241F18;
    --ink-soft: #55483A;
    --seal: #A5312A;
    --seal-dark: #7C2420;
    --gold: #A9843F;
    --cover: #6E1E1E;
    --cover-dark: #501414;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at center, #2b2420 0%, #16120f 100%);
    font-family: "Noto Serif", serif;
    color: var(--ink);
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px 16px;
  }
  .book{
    position:relative;
    width:min(1080px, 96vw);
    background: linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.04) inset;
    padding: 16px;
  }
  .book::before{
    content:"";
    position:absolute; inset:10px;
    border: 1px solid rgba(201,168,90,0.35);
    border-radius: 4px;
    pointer-events:none;
  }
  .spread{
    position:relative;
    display:grid;
    grid-template-columns: 1fr 1fr;
    background: var(--page);
    border-radius: 2px;
    height: calc(100vh - 100px);
    max-height: 860px;
    min-height: 480px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .spread::after{
    content:"";
    position:absolute; left:50%; top:0; bottom:0; width:26px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.14) 45%, rgba(0,0,0,0.14) 55%, transparent);
    pointer-events:none;
  }
  .page{ padding: 28px 26px; position:relative; overflow-y: auto; height: 100%; }
  .page.left{ border-right: none; }
  .page-title{
    font-family:"Noto Serif SC", serif;
    font-weight:700;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--seal-dark);
    margin: 0 0 4px 0;
  }
  .page-sub{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .radical-list{
    columns: 3;
    column-gap: 20px;
  }
  .stroke-group{ margin-bottom: 14px; break-inside: avoid; }
  .stroke-group-label{
    font-size: 11px; color: var(--seal-dark);
    letter-spacing: 2px; margin: 0 0 6px 0;
    font-weight: 600;
    border-bottom: 1px solid rgba(165,49,42,0.25);
    padding-bottom: 3px;
  }
  .radical-row{
    display:flex; align-items:baseline; gap: 7px;
    padding: 5px 3px; border-radius: 3px;
    cursor:pointer; transition: background .15s ease;
  }
  .radical-row:hover{ background: rgba(165,49,42,0.08); }
  .radical-row.active{ background: rgba(165,49,42,0.16); }
  .radical-glyph{
    font-family:"Noto Serif SC", serif;
    font-size: 17px;
    color: var(--ink);
    white-space: nowrap;
    flex: 0 0 auto;
    display:flex; align-items:baseline; gap: 3px;
  }
  .radical-glyph .variant{
    font-size: 12px;
    color: var(--gold);
  }
  .radical-no{
    font-size: 10px; color: var(--gold);
    flex: 0 0 18px;
    text-align: right;
  }
  .radical-meaning{
    font-size: 10px; color: var(--ink-soft); font-style: italic;
    flex: 1 1 auto; min-width: 0;
    overflow-wrap: anywhere;
  }

  /* Right page: entries for selected radical */
  .entries-head{
    display:flex; align-items:center; gap: 14px; margin-bottom: 6px;
  }
  .entries-head .big-glyph{
    font-family:"Noto Serif SC", serif; font-size: 40px; color: var(--seal);
    line-height:1; white-space: nowrap;
    display:flex; align-items:baseline; gap:6px;
  }
  .entries-head .big-glyph .variant-big{
    font-size: 24px; color: var(--gold);
  }
  .entries-head .meta{ font-size:12px; color: var(--ink-soft); }
  .entries-empty{
    margin-top: 60px; text-align:center; color: var(--ink-soft);
    font-style: italic; font-size: 13px;
  }
  .page-range{
    font-size: 12px; color: var(--seal); letter-spacing: 1px;
    margin-bottom: 16px; display: block;
  }
  .page-nav{
    display:flex; align-items:center; justify-content:center; gap: 16px;
    padding: 10px 0 4px;
  }
  .nav-btn{
    background: none; border: 1px solid rgba(239,228,204,0.3);
    color: rgba(239,228,204,0.7); font-size: 18px; cursor: pointer;
    padding: 2px 14px; border-radius: 3px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .nav-btn:hover:not(:disabled){ color: #fff8e8; border-color: rgba(239,228,204,0.7); background: rgba(255,255,255,0.06); }
  .nav-btn:disabled{ opacity: 0.25; cursor: default; }
  .page-dots{ display:flex; gap: 9px; align-items:center; }
  .page-dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(239,228,204,0.3); cursor:pointer;
    transition: background .15s, transform .15s;
  }
  .page-dot.active{ background: rgba(239,228,204,0.85); transform: scale(1.25); }
  .page-counter{ font-size: 11px; color: rgba(239,228,204,0.45); letter-spacing: 1px; }
  .index-head{ margin-bottom: 22px; }
  .index-title{
    font-family:"Noto Serif SC", serif; font-weight:700;
    font-size: 20px; letter-spacing: 3px; color: var(--seal-dark);
  }
  .index-sub{
    font-size: 11px; color: var(--ink-soft); letter-spacing: 1px; margin-top: 5px;
    text-transform: uppercase;
  }
  .stroke-nav-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .stroke-nav-tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 13px 6px;
    border: 1px solid rgba(165,49,42,0.22);
    border-radius: 4px;
    background: #fff8e8;
    cursor:pointer;
    transition: background .15s ease, border-color .15s ease, transform .12s ease;
  }
  .stroke-nav-tile:hover{
    background: rgba(165,49,42,0.09);
    border-color: var(--seal);
    transform: translateY(-1px);
  }
  .snav-label{
    font-family:"Noto Serif SC", serif;
    font-size: 15px; color: var(--ink);
  }
  .snav-count{
    font-size: 10px; color: var(--gold); margin-top: 4px;
  }
  .index-stats{
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid rgba(165,49,42,0.18);
    display: flex; gap: 24px; justify-content: center;
  }
  .stat-item{ text-align: center; }
  .stat-num{
    font-family:"Noto Serif SC", serif; font-size: 22px; color: var(--seal-dark); display:block;
  }
  .stat-label{ font-size: 10px; color: var(--ink-soft); letter-spacing: 1px; text-transform: uppercase; }
  .index-hint{
    text-align:center; font-size: 11px; color: var(--ink-soft);
    font-style:italic; margin-top: 20px;
  }
  .stroke-block{ margin-top: 16px; }
  .stroke-block-label{
    font-size: 11px; color: var(--seal-dark); letter-spacing:2px;
    margin-bottom: 6px;
  }
  .char-grid{
    display:flex; flex-wrap:wrap; gap: 8px;
  }
  .char-tile{
    width: 46px; height: 46px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif SC", serif; font-size: 22px;
    background: #fff8e8;
    border: 1px solid rgba(165,49,42,0.25);
    border-radius: 3px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .char-tile:hover{
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    border-color: var(--seal);
  }

  .thumb-index{ display: none; }

  /* detail overlay — like a slipped-in page */
  .detail-overlay{
    position:fixed; inset:0; background: rgba(15,10,8,0.55);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .18s ease;
    z-index: 10;
  }
  .detail-overlay.show{ opacity:1; pointer-events:auto; }
  .detail-card{
    width: min(360px, 88vw);
    background: #fff8e8;
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    padding: 26px 24px;
    position:relative;
    transform: translateY(10px) scale(0.98);
    transition: transform .18s ease;
    border: 1px solid rgba(165,49,42,0.25);
  }
  .detail-overlay.show .detail-card{ transform: translateY(0) scale(1); }
  .detail-close{
    position:absolute; top:10px; right:14px;
    font-size: 18px; color: var(--ink-soft); cursor:pointer; background:none; border:none;
  }
  .detail-glyph{
    font-family:"Noto Serif SC", serif; font-size: 64px; color: var(--seal);
    text-align:center; line-height:1;
  }
  .detail-pinyin{ text-align:center; font-size: 18px; color: var(--ink-soft); margin: 6px 0 2px; }
  .detail-def{ text-align:center; font-size: 14px; margin-top: 10px; color: var(--ink); }
  .detail-radical-line{
    text-align:center; font-size: 11px; color: var(--gold); margin-top: 14px;
    letter-spacing: 1px;
  }
  .detail-total{
    text-align:center; font-size: 11px; color: var(--ink-soft); margin-top: 4px;
  }

  .footer-note{
    text-align:center; color: rgba(239,228,204,0.55); font-size: 11px;
    margin-top: 14px; letter-spacing: 1px;
  }
  .data-source-badge{
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #f2e8d5; font-size: 11px;
    padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px;
    pointer-events: none; z-index: 5;
  }

  @media (max-width: 720px){
    .spread{ grid-template-columns: 1fr; height: auto; max-height: none; }
    .spread::after{ display:none; }
    .page.left{ border-bottom: 1px dashed rgba(165,49,42,0.3); overflow-y: visible; height: auto; }
    .page{ padding: 20px 16px; }
    .page-title{ font-size: 18px; letter-spacing: 2px; }
    .page-sub{ font-size: 11px; letter-spacing: 0.5px; }
    .radical-list{ columns: 2; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="book">
    <div class="spread">
      <div class="page left">
        <div class="page-title">部首檢字表</div>
        <div class="page-sub">Radical Index · click a radical</div>
        <span id="pageRange" class="page-range"></span>
        <div id="radicalList" class="radical-list"></div>
      </div>
      <div class="page right">
        <div id="entriesPane"></div>
      </div>
      <div id="thumbIndex" class="thumb-index"></div>
    </div>
    <div class="page-nav">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <div class="page-dots" id="pageDots"></div>
      <span class="page-counter" id="pageCounter"></span>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
  </div>
</div>

<div id="detailOverlay" class="detail-overlay">
  <div class="detail-card">
    <button class="detail-close" id="detailClose">&times;</button>
    <div class="detail-glyph" id="detailGlyph"></div>
    <div class="detail-pinyin" id="detailPinyin"></div>
    <div class="detail-def" id="detailDef"></div>
    <div class="detail-radical-line" id="detailRadicalLine"></div>
    <div class="detail-total" id="detailTotal"></div>
  </div>
</div>
<div id="dataSourceBadge" class="data-source-badge"></div>

<script src="radicals_full.js"></script>
<script src="sample_data.js"></script>
<script src="data_loader.js"></script>
<script>
  const radicalListEl = document.getElementById('radicalList');
  const entriesPaneEl = document.getElementById('entriesPane');
  const thumbIndexEl  = document.getElementById('thumbIndex');
  const overlay       = document.getElementById('detailOverlay');

  const RADICALS = KANGXI_RADICALS_FULL;
  let ENTRIES = [];
  let currentPage = 0;

  const byStroke = {};
  RADICALS.forEach(r => {
    (byStroke[r.strokes] = byStroke[r.strokes] || []).push(r);
  });
  const strokeKeys = Object.keys(byStroke).map(Number).sort((a,b)=>a-b);

  // Split strokes into 5 pages: ≤2 / 3 / 4-5 / 6-7 / 8+
  const PAGE_BREAKS = [2, 3, 5, 7];
  const NUM_PAGES   = PAGE_BREAKS.length + 1;

  function pageIdxForStroke(sk){
    for (let i = 0; i < PAGE_BREAKS.length; i++) if (sk <= PAGE_BREAKS[i]) return i;
    return PAGE_BREAKS.length;
  }
  function strokesForPage(p){ return strokeKeys.filter(sk => pageIdxForStroke(sk) === p); }

  const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七'];
  const strokeLabel = sk => (CN[sk-1] || sk) + '画';

  function pageRangeLabel(p){
    const sks = strokesForPage(p);
    if (!sks.length) return '';
    const lo = sks[0], hi = sks[sks.length-1];
    return lo === hi ? strokeLabel(lo) : strokeLabel(lo) + ' — ' + strokeLabel(hi);
  }

  function renderLeftPage(p){
    radicalListEl.innerHTML = '';
    document.getElementById('pageRange').textContent = pageRangeLabel(p);
    strokesForPage(p).forEach(sk => {
      const group = document.createElement('div');
      group.className = 'stroke-group';
      group.id = 'stroke-sec-' + sk;
      const label = document.createElement('div');
      label.className = 'stroke-group-label';
      label.textContent = strokeLabel(sk);
      group.appendChild(label);
      byStroke[sk].forEach(r => {
        const row = document.createElement('div');
        row.className = 'radical-row';
        row.dataset.radical = r.no;
        row.innerHTML = `
          <span class="radical-no">${r.no}</span>
          <span class="radical-glyph">${r.char}${r.variant ? `<span class="variant">${r.variant}</span>` : ''}</span>
          <span class="radical-meaning">${r.meaning}</span>`;
        row.addEventListener('click', () => selectRadical(r.no));
        group.appendChild(row);
      });
      radicalListEl.appendChild(group);
    });
  }

  function renderPageNav(){
    const dotsEl = document.getElementById('pageDots');
    dotsEl.innerHTML = '';
    for (let i = 0; i < NUM_PAGES; i++){
      const dot = document.createElement('div');
      dot.className = 'page-dot' + (i === currentPage ? ' active' : '');
      dot.title = pageRangeLabel(i);
      dot.addEventListener('click', () => goToPage(i));
      dotsEl.appendChild(dot);
    }
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === NUM_PAGES - 1;
    document.getElementById('pageCounter').textContent = (currentPage + 1) + ' / ' + NUM_PAGES;
  }

  function goToPage(p){
    currentPage = p;
    renderLeftPage(p);
    renderDefaultRight(p);
    renderPageNav();
    document.querySelectorAll('.radical-row').forEach(el => el.classList.remove('active'));
  }

  function selectRadical(no){
    document.querySelectorAll('.radical-row').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.radical) === no);
    });
    const radical = RADICALS.find(r => r.no === no);
    const entries = ENTRIES.filter(e => e.r === no).sort((a,b) => a.rs - b.rs);

    const byRs = {};
    entries.forEach(e => (byRs[e.rs] = byRs[e.rs] || []).push(e));
    const rsKeys = Object.keys(byRs).map(Number).sort((a,b)=>a-b);

    let html = `
      <div class="entries-head">
        <div class="big-glyph">${radical.char}${radical.variant ? `<span class="variant-big">${radical.variant}</span>` : ''}</div>
        <div class="meta">部首 ${radical.no} · ${radical.strokes} 画<br>${radical.meaning}</div>
      </div>`;

    if (rsKeys.length === 0)
      html += `<div class="entries-empty">（此部首暂无收字 — no characters yet）</div>`;

    rsKeys.forEach(rs => {
      html += `<div class="stroke-block">
        <div class="stroke-block-label">+${rs} 画（部首外笔画）</div>
        <div class="char-grid">`;
      byRs[rs].forEach(e => { html += `<div class="char-tile" data-word="${e.w}">${e.w}</div>`; });
      html += `</div></div>`;
    });

    entriesPaneEl.innerHTML = html;
    entriesPaneEl.querySelectorAll('.char-tile').forEach(tile => {
      tile.addEventListener('click', () => showDetail(tile.dataset.word, radical));
    });
  }

  function showDetail(word, radical){
    const entry = ENTRIES.find(e => e.w === word);
    document.getElementById('detailGlyph').textContent = entry.w;
    document.getElementById('detailPinyin').textContent = entry.py;
    document.getElementById('detailDef').textContent = entry.def;
    document.getElementById('detailRadicalLine').textContent =
      `部首 ${radical.char} (${radical.no}) · +${entry.rs} 画`;
    document.getElementById('detailTotal').textContent = entry.ts ? `Total strokes: ${entry.ts}` : '';
    overlay.classList.add('show');
  }
  document.getElementById('detailClose').addEventListener('click', () => overlay.classList.remove('show'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });
  document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 0) goToPage(currentPage - 1); });
  document.getElementById('nextBtn').addEventListener('click', () => { if (currentPage < NUM_PAGES - 1) goToPage(currentPage + 1); });

  function renderDefaultRight(p){
    const sks = strokesForPage(p);
    const total = sks.reduce((s,sk) => s + byStroke[sk].length, 0);
    let html = `
      <div class="index-head">
        <div class="index-title">笔画索引</div>
        <div class="index-sub">${pageRangeLabel(p)} · ${total} 部首</div>
      </div>
      <div class="stroke-nav-grid">`;
    sks.forEach(sk => {
      html += `<div class="stroke-nav-tile" data-sk="${sk}">
        <span class="snav-label">${strokeLabel(sk)}</span>
        <span class="snav-count">${byStroke[sk].length} 部首</span>
      </div>`;
    });
    html += `</div>
      <div class="index-stats">
        <div class="stat-item"><span class="stat-num">${RADICALS.length}</span><span class="stat-label">总部首</span></div>
        <div class="stat-item"><span class="stat-num" id="statChars">—</span><span class="stat-label">汉字</span></div>
        <div class="stat-item"><span class="stat-num">${NUM_PAGES}</span><span class="stat-label">页</span></div>
      </div>
      <div class="index-hint">← 左侧选择部首 · select a radical on the left</div>`;
    entriesPaneEl.innerHTML = html;
    entriesPaneEl.querySelectorAll('.stroke-nav-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        document.getElementById('stroke-sec-' + tile.dataset.sk)
          ?.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  async function init(){
    renderLeftPage(currentPage);
    renderDefaultRight(currentPage);
    renderPageNav();

    const { entries, source } = await loadJianziEntries();
    ENTRIES = entries;

    const charStat = document.getElementById('statChars');
    if (charStat) charStat.textContent = ENTRIES.length.toLocaleString();

    const badge = document.getElementById('dataSourceBadge');
    badge.textContent = source === 'full'
      ? `Full dataset — ${ENTRIES.length.toLocaleString()} characters`
      : 'Sample data (~50 chars) — run build_unihan_data.py + serve.py for full dictionary';
  }
  init();
</script>

</body>
</html>
