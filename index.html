<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>检字表 · Radical Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #EFE4CC;
    --page-shadow: #DCCEA8;
    --ink: #241F18;
    --ink-soft: #55483A;
    --seal: #A5312A;
    --seal-dark: #7C2420;
    --gold: #A9843F;
    --cover: #6E1E1E;
    --cover-dark: #501414;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at center, #2b2420 0%, #16120f 100%);
    font-family: "Noto Serif", serif;
    color: var(--ink);
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px 16px;
  }
  .book{
    position:relative;
    width:min(1080px, 96vw);
    background: linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.04) inset;
    padding: 16px;
  }
  .book::before{
    content:"";
    position:absolute; inset:10px;
    border: 1px solid rgba(201,168,90,0.35);
    border-radius: 4px;
    pointer-events:none;
  }
  .spread{
    position:relative;
    display:grid;
    grid-template-columns: 1fr 1fr;
    background: var(--page);
    border-radius: 2px;
    height: calc(100vh - 100px);
    max-height: 860px;
    min-height: 480px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  /* center crease */
  .spread::after{
    content:"";
    position:absolute; left:50%; top:5%; bottom:5%; width:1px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.1) 20%, rgba(0,0,0,0.13) 50%, rgba(0,0,0,0.1) 80%, transparent);
    pointer-events:none; z-index:1;
  }
  .page{ padding: 22px 26px; position:relative; overflow-y: auto; height: 100%; box-sizing:border-box; }
  .page-title{
    font-family:"Noto Serif SC", serif;
    font-weight:700;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--seal-dark);
    margin: 0 0 4px 0;
  }
  .page-sub{
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .radical-list{
    columns: 2;
    column-gap: 16px;
    column-fill: balance;
  }
  .stroke-group{ margin-bottom: 10px; }
  .stroke-group-label{
    font-size: 11px; color: var(--seal-dark);
    letter-spacing: 2px; margin: 8px 0 4px 0;
    font-weight: 700;
    border-bottom: 1px solid rgba(165,49,42,0.3);
    padding-bottom: 3px;
    break-after: avoid;
  }
  .radical-row{
    display:flex; align-items:center; gap: 8px;
    padding: 3px 4px; border-radius: 2px;
    cursor:pointer; transition: background .15s ease;
    line-height: 1.4;
  }
  .radical-row:hover{ background: rgba(165,49,42,0.08); }
  .radical-row.active{ background: rgba(165,49,42,0.16); }
  .radical-glyph{
    font-family:"Noto Serif SC", serif;
    font-size: 20px;
    color: var(--ink);
    white-space: nowrap;
    flex: 0 0 auto;
    display:flex; align-items:baseline; gap: 3px;
  }
  .radical-glyph .variant{ font-size: 13px; color: var(--gold); }
  .radical-no{ font-size: 11px; color: var(--ink-soft); flex: 0 0 26px; text-align: right; }
  .radical-meaning{ display: none; }

  /* Right page: entries for selected radical */
  .entries-head{
    display:flex; align-items:center; gap: 14px; margin-bottom: 6px;
  }
  .entries-head .big-glyph{
    font-family:"Noto Serif SC", serif; font-size: 40px; color: var(--seal);
    line-height:1; white-space: nowrap;
    display:flex; align-items:baseline; gap:6px;
  }
  .entries-head .big-glyph .variant-big{
    font-size: 24px; color: var(--gold);
  }
  .entries-head .meta{ font-size:12px; color: var(--ink-soft); }
  .entries-empty{
    margin-top: 40px; text-align:center; color: var(--ink-soft);
    font-style: italic; font-size: 13px;
  }
  .stroke-block{ margin-top: 16px; }
  .stroke-block-label{
    font-size: 11px; color: var(--seal-dark); letter-spacing:2px;
    margin-bottom: 6px;
  }
  .char-grid{
    display:flex; flex-wrap:wrap; gap: 8px;
  }
  .char-tile{
    width: 46px; height: 46px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Noto Serif SC", serif; font-size: 22px;
    background: #fff8e8;
    border: 1px solid rgba(165,49,42,0.25);
    border-radius: 3px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .char-tile:hover{
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    border-color: var(--seal);
  }

  .thumb-index{ display: none; }

  /* page flip navigation */
  .page-nav{
    display:flex; align-items:center; justify-content:center; gap: 22px;
    padding: 10px 0 4px;
  }
  .nav-btn{
    background:none; border:none; color: rgba(239,228,204,0.7);
    font-size: 26px; cursor:pointer; padding: 0 4px; line-height:1;
    transition: color .15s;
  }
  .nav-btn:hover:not(:disabled){ color: #fff8e8; }
  .nav-btn:disabled{ opacity: 0.18; cursor:default; }
  .page-counter{
    font-size: 11px; color: rgba(239,228,204,0.55); letter-spacing: 1px;
    min-width: 90px; text-align:center;
    font-family:"Noto Serif SC", serif;
  }

  /* detail overlay — like a slipped-in page */
  .detail-overlay{
    position:fixed; inset:0; background: rgba(15,10,8,0.55);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .18s ease;
    z-index: 10;
  }
  .detail-overlay.show{ opacity:1; pointer-events:auto; }
  .detail-card{
    width: min(360px, 88vw);
    background: #fff8e8;
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    padding: 26px 24px;
    position:relative;
    transform: translateY(10px) scale(0.98);
    transition: transform .18s ease;
    border: 1px solid rgba(165,49,42,0.25);
  }
  .detail-overlay.show .detail-card{ transform: translateY(0) scale(1); }
  .detail-close{
    position:absolute; top:10px; right:14px;
    font-size: 18px; color: var(--ink-soft); cursor:pointer; background:none; border:none;
  }
  .detail-glyph{
    font-family:"Noto Serif SC", serif; font-size: 64px; color: var(--seal);
    text-align:center; line-height:1;
  }
  .detail-pinyin{ text-align:center; font-size: 18px; color: var(--ink-soft); margin: 6px 0 2px; }
  .detail-def{ text-align:center; font-size: 14px; margin-top: 10px; color: var(--ink); }
  .detail-radical-line{
    text-align:center; font-size: 11px; color: var(--gold); margin-top: 14px;
    letter-spacing: 1px;
  }
  .detail-total{
    text-align:center; font-size: 11px; color: var(--ink-soft); margin-top: 4px;
  }

  .footer-note{
    text-align:center; color: rgba(239,228,204,0.55); font-size: 11px;
    margin-top: 14px; letter-spacing: 1px;
  }
  .data-source-badge{
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #f2e8d5; font-size: 11px;
    padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px;
    pointer-events: none; z-index: 5;
  }

  @media (max-width: 720px){
    .spread{ grid-template-columns: 1fr; height: auto; overflow: visible; }
    .spread::after{ display:none; }
    .page{ height: auto; overflow-y: visible; padding: 20px 16px; }
    .page-title{ font-size: 18px; }
    .radical-list{ columns: 1; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="book">
    <div class="spread">
      <div class="page left">
        <div class="page-title">部首檢字表</div>
        <div class="page-sub">(一) 部首目錄 · click a radical</div>
        <div id="radicalList" class="radical-list"></div>
      </div>
      <div class="page right">
        <div id="entriesPane"></div>
      </div>
    </div>
    <div class="page-nav">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <span class="page-counter" id="pageCounter"></span>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
  </div>
</div>

<div id="detailOverlay" class="detail-overlay">
  <div class="detail-card">
    <button class="detail-close" id="detailClose">&times;</button>
    <div class="detail-glyph" id="detailGlyph"></div>
    <div class="detail-pinyin" id="detailPinyin"></div>
    <div class="detail-def" id="detailDef"></div>
    <div class="detail-radical-line" id="detailRadicalLine"></div>
    <div class="detail-total" id="detailTotal"></div>
  </div>
</div>
<div id="dataSourceBadge" class="data-source-badge"></div>

<script src="radicals_full.js"></script>
<script src="sample_data.js"></script>
<script src="data_loader.js"></script>
<script>
  const radicalListEl = document.getElementById('radicalList');
  const entriesPaneEl = document.getElementById('entriesPane');
  const detailOverlay = document.getElementById('detailOverlay');

  const RADICALS = KANGXI_RADICALS_FULL;
  let ENTRIES = [];
  let currentPage = 0;

  const byStroke = {};
  RADICALS.forEach(r => {
    (byStroke[r.strokes] = byStroke[r.strokes] || []).push(r);
  });
  const strokeKeys = Object.keys(byStroke).map(Number).sort((a,b)=>a-b);

  // Page breaks: <=2 / 3 / 4-5 / 6-7 / 8+
  const PAGE_BREAKS = [2, 3, 5, 7];
  const NUM_PAGES = PAGE_BREAKS.length + 1;
  function pageIdxForStroke(sk){
    for (let i = 0; i < PAGE_BREAKS.length; i++) if (sk <= PAGE_BREAKS[i]) return i;
    return PAGE_BREAKS.length;
  }
  function strokesForPage(p){ return strokeKeys.filter(sk => pageIdxForStroke(sk) === p); }

  const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七'];
  const strokeLabel = sk => (CN[sk-1] || sk) + '画';

  function renderLeftPage(p){
    radicalListEl.innerHTML = '';
    strokesForPage(p).forEach(sk => {
      const group = document.createElement('div');
      group.className = 'stroke-group';
      group.id = 'stroke-sec-' + sk;
      const label = document.createElement('div');
      label.className = 'stroke-group-label';
      label.textContent = strokeLabel(sk);
      group.appendChild(label);
      byStroke[sk].forEach(r => {
        const row = document.createElement('div');
        row.className = 'radical-row';
        row.dataset.radical = r.no;
        row.innerHTML = `
          <span class="radical-no">${r.no}</span>
          <span class="radical-glyph">${r.char}${r.variant ? `<span class="variant">${r.variant}</span>` : ''}</span>`;
        row.addEventListener('click', () => selectRadical(r.no));
        group.appendChild(row);
      });
      radicalListEl.appendChild(group);
    });
  }

  function renderPageNav(){
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === NUM_PAGES - 1;
    const sks = strokesForPage(currentPage);
    const lo = sks[0], hi = sks[sks.length - 1];
    document.getElementById('pageCounter').textContent =
      lo === hi ? strokeLabel(lo) : strokeLabel(lo) + ' — ' + strokeLabel(hi);
  }

  function goToPage(p){
    currentPage = p;
    renderLeftPage(p);
    renderPageNav();
    renderDefaultRight();
    document.querySelectorAll('.radical-row').forEach(el => el.classList.remove('active'));
  }

  function renderDefaultRight(){
    entriesPaneEl.innerHTML = `<div class="entries-empty" style="margin-top:80px">
      选一个部首<br>
      <small style="font-size:11px;color:var(--ink-soft);letter-spacing:1px">select a radical on the left</small>
    </div>`;
  }

  function selectRadical(no){
    document.querySelectorAll('.radical-row').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.radical) === no);
    });
    const radical = RADICALS.find(r => r.no === no);
    const entries = ENTRIES.filter(e => e.r === no).sort((a,b) => a.rs - b.rs);

    const byRs = {};
    entries.forEach(e => (byRs[e.rs] = byRs[e.rs] || []).push(e));
    const rsKeys = Object.keys(byRs).map(Number).sort((a,b)=>a-b);

    let html = `
      <div class="entries-head">
        <div class="big-glyph">${radical.char}${radical.variant ? `<span class="variant-big">${radical.variant}</span>` : ''}</div>
        <div class="meta">部首 ${radical.no} · ${radical.strokes} 画<br>${radical.meaning}</div>
      </div>`;

    if (rsKeys.length === 0)
      html += `<div class="entries-empty">（此部首暂无收字 — no characters yet）</div>`;

    rsKeys.forEach(rs => {
      html += `<div class="stroke-block">
        <div class="stroke-block-label">+${rs} 画（部首外笔画）</div>
        <div class="char-grid">`;
      byRs[rs].forEach(e => { html += `<div class="char-tile" data-word="${e.w}">${e.w}</div>`; });
      html += `</div></div>`;
    });

    entriesPaneEl.innerHTML = html;
    entriesPaneEl.querySelectorAll('.char-tile').forEach(tile => {
      tile.addEventListener('click', () => showDetail(tile.dataset.word, radical));
    });
  }

  function showDetail(word, radical){
    const entry = ENTRIES.find(e => e.w === word);
    document.getElementById('detailGlyph').textContent = entry.w;
    document.getElementById('detailPinyin').textContent = entry.py;
    document.getElementById('detailDef').textContent = entry.def;
    document.getElementById('detailRadicalLine').textContent =
      `部首 ${radical.char} (${radical.no}) · +${entry.rs} 画`;
    document.getElementById('detailTotal').textContent = entry.ts ? `Total strokes: ${entry.ts}` : '';
    detailOverlay.classList.add('show');
  }
  document.getElementById('detailClose').addEventListener('click', () => detailOverlay.classList.remove('show'));
  detailOverlay.addEventListener('click', e => { if (e.target === detailOverlay) detailOverlay.classList.remove('show'); });
  document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 0) goToPage(currentPage - 1); });
  document.getElementById('nextBtn').addEventListener('click', () => { if (currentPage < NUM_PAGES - 1) goToPage(currentPage + 1); });

  async function init(){
    renderLeftPage(currentPage);
    renderPageNav();
    renderDefaultRight();
    const { entries, source } = await loadJianziEntries();
    ENTRIES = entries;
    const badge = document.getElementById('dataSourceBadge');
    badge.textContent = source === 'full'
      ? `Full dataset — ${ENTRIES.length.toLocaleString()} characters`
      : 'Sample data (~50 chars) — run build_unihan_data.py + serve.py for full dictionary';
  }
  init();
</script>

</body>
</html>
