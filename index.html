<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新华字典 · 部首檢字表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --page: #EFE4CC;
    --page-shadow: #DCCEA8;
    --ink: #241F18;
    --ink-soft: #55483A;
    --seal: #A5312A;
    --seal-dark: #7C2420;
    --gold: #A9843F;
    --cover: #6E1E1E;
    --cover-dark: #501414;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at center, #2b2420 0%, #16120f 100%);
    font-family: "Noto Serif", serif;
    color: var(--ink);
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px 16px;
  }
  .book{
    position:relative;
    width:min(1180px, 97vw);
    background: linear-gradient(180deg, var(--cover) 0%, var(--cover-dark) 100%);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.04) inset;
    padding: 16px;
  }
  .book::before{
    content:"";
    position:absolute; inset:10px;
    border: 1px solid rgba(201,168,90,0.35);
    border-radius: 4px;
    pointer-events:none;
  }

  /* --- search ribbon, tucked into the top of the book like a bookmark --- */
  .search-ribbon{
    display:flex; align-items:center; gap: 10px;
    padding: 4px 10px 12px;
  }
  .search-box{
    flex: 0 1 340px;
    display:flex; align-items:center; gap: 8px;
    background: #fff8e8;
    border: 1px solid rgba(201,168,90,0.5);
    border-radius: 20px;
    padding: 7px 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }
  .search-box svg{ flex: 0 0 auto; opacity:0.55; }
  .search-box input{
    border:none; outline:none; background:none;
    font-family:"Noto Serif SC", serif;
    font-size: 14px; color: var(--ink);
    width: 100%;
  }
  .search-box input::placeholder{ color: var(--ink-soft); opacity:0.65; font-family:"Noto Serif", serif; font-style: italic; }
  .search-clear{
    background:none; border:none; cursor:pointer; color: var(--ink-soft);
    font-size: 14px; opacity:0.6; padding: 0 2px; display:none;
  }
  .search-clear.show{ display:inline; }
  .search-hint{
    font-size: 11px; color: rgba(239,228,204,0.55); letter-spacing: 0.5px;
  }

  .spread{
    position:relative;
    display:flex;
    background: var(--page);
    border-radius: 2px;
    height: calc(100vh - 148px);
    max-height: 820px;
    min-height: 460px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  /* center crease */
  .spread::after{
    content:"";
    position:absolute; left:50%; top:0; bottom:0; width:1px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.14) 15%, rgba(0,0,0,0.18) 50%, rgba(0,0,0,0.14) 85%, transparent);
    box-shadow: -6px 0 14px -6px rgba(0,0,0,0.18) inset, 6px 0 14px -6px rgba(0,0,0,0.18) inset;
    pointer-events:none; z-index:1;
  }
  .page{
    flex: 1 1 50%;
    width: 50%;
    padding: 20px 26px 30px;
    position:relative;
    display:flex; flex-direction:column;
    height:100%; box-sizing:border-box;
    transition: opacity .15s ease;
  }
  .page-left{ padding-right: 20px; }
  .page-right{ padding-left: 20px; }

  .page-running-head{
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--ink-soft); opacity: 0.65; margin-bottom: 2px;
  }
  .page-title{
    font-family:"Noto Serif SC", serif;
    font-weight:700;
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--seal-dark);
    margin: 0 0 4px 0;
  }
  .page-sub{
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  /* ---------------- LEFT PAGE: radical index ---------------- */
  .radical-list{
    columns: 3;
    column-gap: 16px;
    column-fill: balance;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
  }
  .stroke-group{ margin-bottom: 9px; break-inside: avoid; }
  .stroke-group-label{
    font-size: 10px; color: var(--seal-dark);
    letter-spacing: 2px; margin: 6px 0 3px 0;
    font-weight: 700;
    border-bottom: 1px solid rgba(165,49,42,0.3);
    padding-bottom: 2px;
    break-after: avoid;
  }
  .radical-row{
    display:flex; align-items:center; gap: 7px;
    padding: 2px 4px; border-radius: 2px;
    cursor:pointer; transition: background .15s ease;
    line-height: 1.35;
  }
  .radical-row:hover{ background: rgba(165,49,42,0.08); }
  .radical-row.active{ background: rgba(165,49,42,0.16); }
  .radical-glyph{
    font-family:"Noto Serif SC", serif;
    font-size: 16px;
    color: var(--ink);
    white-space: nowrap;
    flex: 0 0 auto;
    display:flex; align-items:baseline; gap: 3px;
  }
  .radical-glyph .variant{ font-size: 12px; color: var(--gold); }
  .radical-no{ font-size: 10px; color: var(--ink-soft); flex: 0 0 22px; text-align: right; }

  /* ---------------- RIGHT PAGE: dictionary body ---------------- */
  .entries-page{ flex: 1 1 0; min-height: 0; display:flex; flex-direction:column; }
  .entries-head{
    display:flex; align-items:baseline; gap: 12px; margin-bottom: 4px;
    padding-bottom: 8px; border-bottom: 1.5px solid rgba(165,49,42,0.35);
  }
  .entries-head .big-glyph{
    font-family:"Noto Serif SC", serif; font-size: 34px; color: var(--seal);
    line-height:1; white-space: nowrap;
    display:flex; align-items:baseline; gap:5px;
  }
  .entries-head .big-glyph .variant-big{ font-size: 20px; color: var(--gold); }
  .entries-head .meta{ font-size:11px; color: var(--ink-soft); line-height:1.5; }
  .entries-empty{
    margin-top: 40px; text-align:center; color: var(--ink-soft);
    font-style: italic; font-size: 13px;
  }
  .entries-body{ flex: 1 1 0; overflow-y: auto; padding-right: 2px; }
  .entries-body::-webkit-scrollbar{ width: 5px; }
  .entries-body::-webkit-scrollbar-thumb{ background: rgba(165,49,42,0.25); border-radius: 4px; }

  .stroke-block{ margin-top: 12px; break-inside: avoid; }
  .stroke-block-label{
    font-size: 10px; color: var(--seal-dark); letter-spacing:2px;
    margin-bottom: 4px; font-weight: 700;
  }
  .dict-entries{ columns: 2; column-gap: 20px; }
  .dict-entry{
    break-inside: avoid;
    padding: 3px 4px 5px 0;
    cursor: pointer;
    border-radius: 2px;
    line-height: 1.5;
  }
  .dict-entry:hover{ background: rgba(165,49,42,0.06); }
  .dict-entry.flash{ background: rgba(165,49,42,0.22); }
  .dict-entry .headword{
    font-family:"Noto Serif SC", serif; font-weight: 700;
    font-size: 16px; color: var(--ink);
  }
  .dict-entry .head-pinyin{
    font-size: 12px; color: var(--seal-dark); margin-left: 6px; font-style: italic;
  }
  .dict-entry .head-strokes{
    font-size: 10px; color: var(--gold); margin-left: 5px;
  }
  .dict-entry .head-def{
    display:block; font-size: 12px; color: var(--ink-soft); margin-top: 1px;
  }

  /* search results, rendered on the right page in the same dictionary style */
  .search-meta{ font-size: 11px; color: var(--ink-soft); margin-bottom: 8px; }
  .search-group-label{
    font-size: 10px; color: var(--seal-dark); letter-spacing: 2px;
    font-weight: 700; margin: 10px 0 4px; break-after: avoid;
  }

  /* page number, bottom corner of every page — like a real printed book */
  .page-number{
    position:absolute; bottom: 8px; font-size: 10px; color: var(--ink-soft);
    opacity: 0.55; letter-spacing: 1px;
  }
  .page-left .page-number{ left: 26px; }
  .page-right .page-number{ right: 26px; }

  /* page-turn flip effect */
  .spread.flipping .page-left{ animation: leafOut .34s ease; }
  .spread.flipping .page-right{ animation: leafIn .34s ease; }
  @keyframes leafOut{
    0%{ opacity:1; transform: none; }
    45%{ opacity:0.15; transform: perspective(1400px) rotateY(-6deg) scale(0.99); }
    100%{ opacity:1; transform: none; }
  }
  @keyframes leafIn{
    0%{ opacity:1; transform: none; }
    45%{ opacity:0.15; transform: perspective(1400px) rotateY(6deg) scale(0.99); }
    100%{ opacity:1; transform: none; }
  }

  /* page flip navigation (left-page index pager) */
  .page-nav{
    display:flex; align-items:center; justify-content:center; gap: 22px;
    padding: 10px 0 4px;
  }
  .nav-btn{
    background:none; border:none; color: rgba(239,228,204,0.7);
    font-size: 26px; cursor:pointer; padding: 0 4px; line-height:1;
    transition: color .15s;
  }
  .nav-btn:hover:not(:disabled){ color: #fff8e8; }
  .nav-btn:disabled{ opacity: 0.18; cursor:default; }
  .page-counter{
    font-size: 11px; color: rgba(239,228,204,0.55); letter-spacing: 1px;
    min-width: 90px; text-align:center;
    font-family:"Noto Serif SC", serif;
  }

  .footer-note{
    text-align:center; color: rgba(239,228,204,0.55); font-size: 11px;
    margin-top: 14px; letter-spacing: 1px;
  }
  .data-source-badge{
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #f2e8d5; font-size: 11px;
    padding: 6px 12px; border-radius: 20px; letter-spacing: 0.5px;
    pointer-events: none; z-index: 5;
  }

  @media (max-width: 820px){
    .spread{ flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
    .page{ width: 100%; height: auto; }
    .page-left{ padding-right: 26px; border-bottom: 8px solid rgba(0,0,0,0.06); }
    .radical-list{ columns: 2; flex: none; overflow: visible; }
    .dict-entries{ columns: 1; }
    .spread::after{ display:none; }
    .page-number{ position: static; margin-top: 8px; text-align: right; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="book">

    <div class="search-ribbon">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="查字 / 拼音 / meaning…" autocomplete="off">
        <button class="search-clear" id="searchClear">&times;</button>
      </div>
      <span class="search-hint" id="searchHint"></span>
    </div>

    <div class="spread" id="spread">
      <div class="page page-left">
        <div class="page-running-head">部首檢字表 · Radical Index</div>
        <div class="page-title">部首目錄</div>
        <div class="page-sub">(一) click a radical to open the facing page</div>
        <div id="radicalList" class="radical-list"></div>
        <div class="page-number" id="pageNumLeft"></div>
      </div>
      <div class="page page-right">
        <div class="entries-page" id="entriesPage">
          <div class="entries-empty">选择左侧部首，或搜索一个字<br><span style="font-size:11px;">Select a radical on the left, or search above</span></div>
        </div>
        <div class="page-number" id="pageNumRight"></div>
      </div>
    </div>

    <div class="page-nav">
      <button class="nav-btn" id="prevBtn">&#8249;</button>
      <span class="page-counter" id="pageCounter"></span>
      <button class="nav-btn" id="nextBtn">&#8250;</button>
    </div>
  </div>
</div>

<div id="dataSourceBadge" class="data-source-badge"></div>

<script src="radicals_full.js"></script>
<script src="sample_data.js"></script>
<script src="data_loader.js"></script>
<script>
  const radicalListEl  = document.getElementById('radicalList');
  const entriesPageEl  = document.getElementById('entriesPage');
  const spreadEl        = document.getElementById('spread');
  const searchInput     = document.getElementById('searchInput');
  const searchClear     = document.getElementById('searchClear');
  const searchHint      = document.getElementById('searchHint');

  const RADICALS = KANGXI_RADICALS_FULL;
  let ENTRIES = [];
  let currentPage = 0;
  let currentRadicalNo = null;

  const byStroke = {};
  RADICALS.forEach(r => {
    (byStroke[r.strokes] = byStroke[r.strokes] || []).push(r);
  });
  const strokeKeys = Object.keys(byStroke).map(Number).sort((a,b)=>a-b);

  // Page breaks: <=4 / 5-8 / 9+  →  3 pages (~90 / ~75 / ~50 radicals)
  const PAGE_BREAKS = [4, 8];
  const NUM_PAGES = PAGE_BREAKS.length + 1;
  function pageIdxForStroke(sk){
    for (let i = 0; i < PAGE_BREAKS.length; i++) if (sk <= PAGE_BREAKS[i]) return i;
    return PAGE_BREAKS.length;
  }
  function strokesForPage(p){ return strokeKeys.filter(sk => pageIdxForStroke(sk) === p); }

  const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七'];
  const strokeLabel = sk => (CN[sk-1] || sk) + '画';

  function renderPage(p){
    radicalListEl.innerHTML = '';
    strokesForPage(p).forEach(sk => {
      const group = document.createElement('div');
      group.className = 'stroke-group';
      const label = document.createElement('div');
      label.className = 'stroke-group-label';
      label.textContent = strokeLabel(sk);
      group.appendChild(label);
      byStroke[sk].forEach(r => {
        const row = document.createElement('div');
        row.className = 'radical-row';
        row.dataset.radical = r.no;
        row.innerHTML = `
          <span class="radical-no">${r.no}</span>
          <span class="radical-glyph">${r.char}${r.variant ? `<span class="variant">${r.variant}</span>` : ''}</span>`;
        row.addEventListener('click', () => selectRadical(r.no));
        group.appendChild(row);
      });
      radicalListEl.appendChild(group);
    });
    document.getElementById('pageNumLeft').textContent = (p * 2 + 1);
    document.getElementById('pageNumRight').textContent = (p * 2 + 2);
  }

  function renderPageNav(){
    document.getElementById('prevBtn').disabled = currentPage === 0;
    document.getElementById('nextBtn').disabled = currentPage === NUM_PAGES - 1;
    const sks = strokesForPage(currentPage);
    const lo = sks[0], hi = sks[sks.length - 1];
    document.getElementById('pageCounter').textContent =
      lo === hi ? strokeLabel(lo) : strokeLabel(lo) + ' — ' + strokeLabel(hi);
  }

  function goToPage(p, { silent } = {}){
    currentPage = p;
    if (!silent){
      spreadEl.classList.add('flipping');
      setTimeout(() => spreadEl.classList.remove('flipping'), 340);
    }
    renderPage(p);
    renderPageNav();
    highlightActiveRadical();
  }

  function highlightActiveRadical(){
    document.querySelectorAll('.radical-row').forEach(el => {
      el.classList.toggle('active', Number(el.dataset.radical) === currentRadicalNo);
    });
  }

  // Build the facing-page dictionary entries for one radical, in the
  // running style of a real Xinhua Zidian body page: headword, pinyin,
  // total-stroke count, then the gloss — grouped by residual strokes,
  // same grouping the 检字表 index itself uses.
  function dictEntryHTML(e){
    const strokes = e.ts ? `<span class="head-strokes">共${e.ts}画</span>` : '';
    return `
      <div class="dict-entry" data-word="${e.w}">
        <span class="headword">${e.w}</span><span class="head-pinyin">${e.py}</span>${strokes}
        <span class="head-def">${e.def}</span>
      </div>`;
  }

  function renderRadicalPage(no, { highlightWord } = {}){
    const radical = RADICALS.find(r => r.no === no);
    const entries = ENTRIES.filter(e => e.r === no).sort((a,b) => a.rs - b.rs);
    const byRs = {};
    entries.forEach(e => (byRs[e.rs] = byRs[e.rs] || []).push(e));
    const rsKeys = Object.keys(byRs).map(Number).sort((a,b)=>a-b);

    let html = `
      <div class="entries-head">
        <div class="big-glyph">${radical.char}${radical.variant ? `<span class="variant-big">${radical.variant}</span>` : ''}</div>
        <div class="meta">部首 ${radical.no} · ${radical.strokes} 画 · ${radical.pinyin}<br>${radical.meaning}</div>
      </div>
      <div class="entries-body">`;
    if (rsKeys.length === 0){
      html += `<div class="entries-empty">（此部首暂无收字）</div>`;
    } else {
      rsKeys.forEach(rs => {
        html += `<div class="stroke-block"><div class="stroke-block-label">+${rs} 画</div><div class="dict-entries">`;
        byRs[rs].forEach(e => { html += dictEntryHTML(e); });
        html += `</div></div>`;
      });
    }
    html += `</div>`;
    entriesPageEl.innerHTML = html;

    if (highlightWord){
      const tile = entriesPageEl.querySelector(`.dict-entry[data-word="${highlightWord}"]`);
      if (tile){
        tile.classList.add('flash');
        tile.scrollIntoView({ block: 'center' });
        setTimeout(() => tile.classList.remove('flash'), 1400);
      }
    }
  }

  function selectRadical(no, opts){
    currentRadicalNo = no;
    highlightActiveRadical();
    renderRadicalPage(no, opts);
  }

  document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 0) goToPage(currentPage - 1); });
  document.getElementById('nextBtn').addEventListener('click', () => { if (currentPage < NUM_PAGES - 1) goToPage(currentPage + 1); });

  // ---------------- search ----------------
  function stripTones(s){
    return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }
  const isHanChar = ch => /[\u4e00-\u9fff]/.test(ch);

  function runSearch(qRaw){
    const q = qRaw.trim();
    searchClear.classList.toggle('show', q.length > 0);
    if (!q){
      searchHint.textContent = '';
      if (currentRadicalNo){
        renderRadicalPage(currentRadicalNo);
      } else {
        entriesPageEl.innerHTML = `<div class="entries-empty">选择左侧部首，或搜索一个字<br><span style="font-size:11px;">Select a radical on the left, or search above</span></div>`;
      }
      return;
    }

    const qHan = [...q].filter(isHanChar);
    const qLatin = stripTones(q);

    let results;
    if (qHan.length){
      results = ENTRIES.filter(e => qHan.includes(e.w));
    } else {
      results = ENTRIES.filter(e =>
        stripTones(e.py).includes(qLatin) ||
        (e.def || '').toLowerCase().includes(qLatin)
      ).slice(0, 200);
    }

    searchHint.textContent = results.length ? `${results.length} found` : 'no matches';
    document.querySelectorAll('.radical-row').forEach(el => el.classList.remove('active'));

    if (!results.length){
      entriesPageEl.innerHTML = `<div class="entries-empty">未找到「${q}」<br><span style="font-size:11px;">No matches for "${q}"</span></div>`;
      return;
    }

    const byRadical = {};
    results.forEach(e => (byRadical[e.r] = byRadical[e.r] || []).push(e));
    const radicalKeys = Object.keys(byRadical).map(Number).sort((a,b)=>a-b);

    let html = `<div class="search-meta">「${q}」 — ${results.length} result${results.length===1?'':'s'}</div><div class="entries-body">`;
    radicalKeys.forEach(rno => {
      const radical = RADICALS.find(r => r.no === rno);
      html += `<div class="search-group-label">部首 ${radical.char} (${rno})</div><div class="dict-entries">`;
      byRadical[rno].forEach(e => { html += dictEntryHTML(e); });
      html += `</div>`;
    });
    html += `</div>`;
    entriesPageEl.innerHTML = html;
  }

  entriesPageEl.addEventListener('click', (e) => {
    const tile = e.target.closest('.dict-entry');
    if (!tile) return;
    const entry = ENTRIES.find(x => x.w === tile.dataset.word);
    if (!entry) return;
    // jump the left index to this character's radical page and open it
    const sk = RADICALS.find(r => r.no === entry.r).strokes;
    const targetPage = pageIdxForStroke(sk);
    if (targetPage !== currentPage) goToPage(targetPage, { silent: true });
    searchInput.value = '';
    searchClear.classList.remove('show');
    searchHint.textContent = '';
    selectRadical(entry.r, { highlightWord: entry.w });
  });

  let searchDebounce;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => runSearch(searchInput.value), 120);
  });
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    runSearch('');
    searchInput.focus();
  });

  async function init(){
    renderPage(currentPage);
    renderPageNav();
    const { entries, source } = await loadJianziEntries();
    ENTRIES = entries;
    const badge = document.getElementById('dataSourceBadge');
    badge.textContent = source === 'full'
      ? `Full dataset — ${ENTRIES.length.toLocaleString()} characters`
      : 'Sample data (~50 chars) — run build_unihan_data.py + serve.py for full dictionary';
  }
  init();
</script>

</body>
</html>
